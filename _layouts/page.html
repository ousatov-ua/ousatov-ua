---
layout: default
---

<article class="page">
  <header class="page__header">
    <p class="eyebrow">{{ page.kicker | default: site.name }}</p>
    <h1>{{ page.title }}</h1>
    {% if page.description %}
      <p class="lede">{{ page.description }}</p>
    {% endif %}
  </header>
  <div class="page__body">
    {{ content }}
  </div>
</article>
